# Prometheus (stage 10). Scrapes the app and the exporters inside the compose network.
# Retention is set in the command (compose): 10 days, to keep disk and RAM small.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
