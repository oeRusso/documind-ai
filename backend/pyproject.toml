[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI backend: FastAPI API and workers"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6,<5.7",
    "fastapi[standard]>=0.162.0",
    "kombu>=5.6,<5.7",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=1.27.2.3,<2",
    "python-docx>=1.2",
    "python-magic>=0.4.27",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "SIM",      # simplify
    "RUF",
]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]  # assert, fake secrets, tiny files on disk
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]


[[tool.mypy.overrides]]
# Celery ships no type hints; its task decorator is untyped.
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.modules.ingestion.presentation.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL"]
